name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release is created once, here, so that the build jobs only ever upload to it. Two jobs
  # racing to create it leaves the loser failing and its platform's binary never published.
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  binaries:
    needs: create
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Locked, because the Lighthouse pins are exact on purpose and a release should be the build
      # that was tested.
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name=proof_seeder-${GITHUB_REF_NAME}-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/${{ matrix.target }}/release proof_seeder
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            proof_seeder-*.tar.gz proof_seeder-*.tar.gz.sha256 --clobber
